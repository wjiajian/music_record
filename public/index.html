<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f9f8f5">
    <meta name="description" content="音乐记录：按本地时间观察播放、排行、趋势与歌单。">
    <title>音乐记录</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <!-- Lucide 0.468.0：仅保留本站使用的图标，内联且不依赖运行时。 -->
    <svg class="svg-sprite" data-lucide-version="0.468.0" aria-hidden="true">
      <symbol id="icon-rotate-cw" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"></path><path d="M21 3v5h-5"></path>
      </symbol>
      <symbol id="icon-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></symbol>
      <symbol id="icon-mic2" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"></path></symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></symbol>
    </svg>

    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="#overview" aria-label="音乐记录首页">
          <span class="brand__name">音乐记录</span>
        </a>
        <nav class="nav-links" aria-label="页面导航"><a href="#overview">今天</a><a href="#trend">趋势</a><a href="#covers">封面</a><a href="#playlists">歌单</a></nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero" id="overview" aria-labelledby="pageTitle">
        <div class="hero__copy">
          <p class="service-status" id="serviceStatus" data-state="loading"><span class="status-dot" aria-hidden="true"></span><span id="serviceStatusText">正在读取</span><span id="heroSubtitle"></span></p>
          <h1 id="pageTitle"><time id="heroDate"></time></h1>
        </div>
        <div class="hero__controls">
          <div class="segmented" role="group" aria-label="统计窗口；同时控制概览与排行">
            <button class="seg-button is-active" type="button" data-window="day" aria-pressed="true">今天</button><button class="seg-button" type="button" data-window="week" aria-pressed="false">7 天</button><button class="seg-button" type="button" data-window="month" aria-pressed="false">30 天</button><button class="seg-button" type="button" data-window="year" aria-pressed="false">一年</button><button class="seg-button" type="button" data-window="all" aria-pressed="false">全部</button>
          </div>
          <button class="button-secondary" id="refreshButton" type="button"><svg aria-hidden="true"><use href="#icon-rotate-cw"></use></svg>刷新</button>
        </div>
        <div class="metric-grid">
          <article class="metric-card"><p class="metric-label">播放</p><p class="metric-value is-accent" id="metricPlays">--</p><p class="metric-hint" id="metricPlaysHint">次</p></article>
          <article class="metric-card"><p class="metric-label">时长</p><p class="metric-value" id="metricHours">--</p><p class="metric-hint">小时，按曲长估算</p></article>
          <article class="metric-card"><p class="metric-label">歌曲</p><p class="metric-value" id="metricSongs">--</p><p class="metric-hint">首不同的歌</p></article>
          <article class="metric-card"><p class="metric-label">有播放的天数</p><p class="metric-value" id="metricDays">--</p><p class="metric-hint" id="metricRange">天</p></article>
        </div>
      </section>

      <div class="split">
        <section class="block" id="ranking" aria-labelledby="rankingTitle">
          <div class="block-head">
            <h2 id="rankingTitle">排行</h2>
            <div class="tabs" role="group" aria-label="排行维度">
              <button class="tab is-active" type="button" data-dimension="song" aria-pressed="true">歌曲</button><button class="tab" type="button" data-dimension="artist" aria-pressed="false">歌手</button><button class="tab" type="button" data-dimension="album" aria-pressed="false">专辑</button>
            </div>
          </div>
          <p class="block-meta" id="rankingRange"></p>
          <ol class="rank-list" id="rankingList" aria-live="polite"></ol>
        </section>

        <section class="block" id="live" aria-labelledby="recentTitle">
          <div class="block-head">
            <h2 id="recentTitle">最近播放</h2>
          </div>
          <p class="block-meta">每分钟更新</p>
          <ol class="recent-list" id="recentList" aria-live="polite"></ol>
        </section>
      </div>

      <section class="block" id="trend" aria-labelledby="trendTitle">
        <div class="block-head">
          <h2 id="trendTitle">播放趋势</h2>
          <div class="tabs" role="group" aria-label="趋势周期">
            <button class="tab is-active" type="button" data-granularity="day" aria-pressed="true">按日</button><button class="tab" type="button" data-granularity="week" aria-pressed="false">按周</button><button class="tab" type="button" data-granularity="month" aria-pressed="false">按月</button>
          </div>
        </div>
        <div class="trend-chart" id="trendChart" aria-live="polite"></div>
        <p class="detail-line" id="trendDetail" aria-live="polite"></p>
        <div class="hourly">
          <div class="hourly__head"><h3>一天里什么时候听</h3><p id="hourlyMeta">近 30 天 · 不含今天</p></div>
          <div class="hourly-heatmap" id="hourlyHeatmap" aria-label="00 时至 23 时播放事件分布" aria-live="polite"></div>
          <p class="detail-line" id="hourlyDetail" aria-live="polite"></p>
        </div>
      </section>

      <section class="block" id="covers" aria-labelledby="coversTitle">
        <div class="block-head">
          <h2 id="coversTitle">这一周的封面</h2>
          <span class="block-note">每天播放最多的十首</span>
        </div>
        <ol class="mosaic" id="mosaic" aria-label="最近七天每日听过的歌曲封面"></ol>
        <p class="detail-line" id="mosaicDetail" aria-live="polite"></p>
        <p class="block-meta" id="mosaicSummary" hidden></p>
      </section>

      <section class="block" id="playlists" aria-labelledby="playlistsTitle">
        <div class="block-head">
          <h2 id="playlistsTitle">歌单</h2>
          <span class="block-note" id="playlistCount">--</span>
        </div>
        <div class="playlist-layout">
          <div class="playlist-index">
            <div class="playlist-list" id="playlistList" aria-live="polite"></div>
            <div class="pager" id="playlistPager" hidden></div>
          </div>
          <div class="tracks">
            <div class="tracks__head"><h3 id="playlistTrackTitle">曲目</h3><span id="trackCount">--</span></div>
            <ol class="track-list" id="playlistTracks" aria-live="polite"></ol>
            <div class="pager" id="playlistTracksPager" hidden></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="page-footer">
      <div class="page-footer__inner"><span>数据来自网易云听歌记录，每天定时快照，最近播放每分钟轮询</span><span class="mono" id="footerTimezone">Asia/Shanghai</span></div>
    </footer>
  </body>
</html>
